aid: varda-space-industries
name: Varda Space Industries
description: 'Varda Space Industries is an American space manufacturing company founded
  in 2021 and headquartered in El Segundo, California. Varda designs, builds and flies
  the W-Series, a free-flying orbital production satellite paired with a hypersonic
  reentry capsule, so that materials can be processed in microgravity and returned
  to Earth. The company sells three lines of service: biopharmaceutical processing
  (small-molecule crystallization that gravity disrupts on Earth), a government hypersonic
  flight testbed that uses the capsule''s Mach 25 reentry as a test article carrier,
  and general microgravity research flights. Varda is a hardware and manufacturing-services
  business rather than a software vendor: as of this profile it publishes no public
  API, developer portal, SDK or machine-readable specification, and customer-facing
  technical interfaces are documented in a downloadable Payload User Guide PDF.'
